<body>
    <script>
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;

            // While there remain elements to shuffle...
            while (currentIndex != 0) {

                // Pick a remaining element...
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;

                // And swap it with the current element.
                [array[currentIndex], array[randomIndex]] = [
                    array[randomIndex], array[currentIndex]];
            }

            return array;
        }


        function randomize() {
            // identify game mode
            // identify checked players
            // fail if not enough players
            // define one or two target groups
            // populate each target group
            // update contents below form

            // TODO: max v max?
            var groupSizes = {
                '4v4': [4, 4],
                '2v2': [2, 2],
                '1v4': [1, 4],
                '8p FFA': [8],
                '4p FFA': [4]
            };

            var allModes = Array.from(document.querySelectorAll('.game-mode > .form-check'));
            var selectedMode = allModes.filter(node => node.getElementsByClassName('form-check-input')[0].checked)[0].getElementsByClassName('form-check-label')[0].innerText;

            var allPlayers = Array.from(document.querySelectorAll('.players > .form-check'));
            var selectedPlayers = Array.from(allPlayers.filter(node => node.getElementsByClassName('form-check-input')[0].checked)).map(node => node.getElementsByClassName('form-check-label')[0].innerText);

            var groupsNeeded = groupSizes[selectedMode];
            var playersNeeded = groupsNeeded.reduce((a, b) => a + b, 0);

            if (selectedPlayers.length < playersNeeded) {
                alert('need more players!');
                return;
            }

            var groups = groupsNeeded.map(group => []);
            var shuffledPlayers = shuffle([...selectedPlayers]);
            groupsNeeded.forEach((desiredPlayerCount, index) => {
                while (groups[index].length < desiredPlayerCount) {
                    groups[index].push(shuffledPlayers.pop());
                }
            });
            var sittingOut = [...shuffledPlayers];

            var outputText = '';
            groups.forEach((group, index) => {
                var thisTeam = group.join(', ');
                outputText += thisTeam;
                if (index < groups.length-1) {
                    outputText += ' VERSUS ';
                }
            })
            Array.from(document.getElementsByClassName("results"))[0].textContent = outputText;
        }
    </script>
